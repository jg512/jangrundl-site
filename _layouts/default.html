<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% feed_meta %}
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="{{ '/' | relative_url }}">Jan V. Grundl</a>
  <ul class="nav-links">
    <li><a href="{{ '/' | relative_url }}#about">About</a></li>
    <li><a href="{{ '/' | relative_url }}#cv">CV</a></li>
    <li><a href="{{ '/' | relative_url }}#projects">Projects</a></li>
    <li><a href="{{ '/' | relative_url }}#volunteer">Volunteer</a></li>
    <li><a href="{{ '/journal/' | relative_url }}">Journal</a></li>
  </ul>
</nav>

{{ content }}

<!-- FOOTER -->
<footer>
  <span class="footer-name">Jan Victornino Grundl</span>
  <span class="footer-copy">© 2026 — Built with purpose in Rostock</span>
</footer>

<script>
  const reveals = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  reveals.forEach(el => io.observe(el));
</script>
</body>
</html>
