<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="1024x1024" href="{{ '/assets/icon.png' | relative_url }}">
{% seo %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% feed_meta %}
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="{{ '/' | relative_url }}">Jan V. Grundl</a>
  <ul class="nav-links">
    <li><a href="{{ '/' | relative_url }}#about">About</a></li>
    <li><a href="{{ '/' | relative_url }}#cv">CV</a></li>
    <li><a href="{{ '/' | relative_url }}#projects">Projects</a></li>
    <li><a href="{{ '/' | relative_url }}#volunteer">Volunteer</a></li>
    <li><a href="{{ '/journal/' | relative_url }}">Journal</a></li>
  </ul>
  <button class="nav-toggle" aria-label="Toggle navigation">
    <span></span>
    <span></span>
  </button>
</nav>

<!-- MOBILE MENU OVERLAY -->
<div class="menu-overlay">
  <ul class="menu-links">
    <li><a href="{{ '/' | relative_url }}#about">About</a></li>
    <li><a href="{{ '/' | relative_url }}#cv">CV</a></li>
    <li><a href="{{ '/' | relative_url }}#projects">Projects</a></li>
    <li><a href="{{ '/' | relative_url }}#volunteer">Volunteer</a></li>
    <li><a href="{{ '/journal/' | relative_url }}">Journal</a></li>
  </ul>
</div>

{{ content }}

<!-- FOOTER -->
<footer>
  <span class="footer-name">Jan Victornino Grundl</span>
  <span class="footer-copy">© 2026 — Built with purpose in Rostock</span>
</footer>

<script>
  // --- Mobile Menu Toggle ---
  const navToggle = document.querySelector('.nav-toggle');
  const menuOverlay = document.querySelector('.menu-overlay');
  const menuLinks = document.querySelectorAll('.menu-links a');

  navToggle.addEventListener('click', () => {
    navToggle.classList.toggle('active');
    menuOverlay.classList.toggle('active');
    document.body.style.overflow = menuOverlay.classList.contains('active') ? 'hidden' : '';
  });

  menuLinks.forEach(link => {
    link.addEventListener('click', () => {
      navToggle.classList.remove('active');
      menuOverlay.classList.remove('active');
      document.body.style.overflow = '';
    });
  });

  const reveals = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  reveals.forEach(el => io.observe(el));

  // --- Easter Eggs ---
  console.log("%cAh, a fellow developer.", "color: #c8a96e; font-size: 16px; font-weight: bold;");
  console.log("%cIf you're reading this, we should talk: janvictorninogrundl@gmail.com", "color: #3d7a54; font-size: 14px;");

  const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
  let konamiIndex = 0;
  document.addEventListener('keydown', (e) => {
    if (e.key === konamiCode[konamiIndex]) {
      konamiIndex++;
      if (konamiIndex === konamiCode.length) {
        document.documentElement.style.setProperty('--cream', '#000000');
        document.documentElement.style.setProperty('--white', '#0a0a0a');
        document.documentElement.style.setProperty('--ink', '#00ff00');
        document.documentElement.style.setProperty('--ink-soft', '#00cc00');
        document.documentElement.style.setProperty('--green-dark', '#051105');
        document.documentElement.style.setProperty('--green-mid', '#00ff00');
        document.body.style.fontFamily = 'monospace';
        console.log("System override: Terminal mode activated.");
        konamiIndex = 0;
      }
    } else {
      konamiIndex = 0;
    }
  });
</script>
</body>
</html>
